name: Check source links

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Get each source address and compare the hash
        run: python run.py links
      - name: Save the report
        run: |
          cat validation/links.md >> "$GITHUB_STEP_SUMMARY"
          git config user.name "commitment-ledger-watcher"
          git config user.email "actions@users.noreply.github.com"
          git add validation/links.md
          git commit -m "Link check: report" || echo "no change"
          git push
